services:
  - type: web
    name: opensource-study-room-hw2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/server.py --no-browser
    healthCheckPath: /api/bootstrap
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: STUDY_DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.8
