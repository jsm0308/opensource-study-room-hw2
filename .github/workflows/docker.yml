name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.hub.outputs.configured }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: study-room:ci

      - name: Start container and check the app
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name study-room-ci \
            -p 127.0.0.1:10000:10000 \
            study-room:ci
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:10000/api/bootstrap", timeout=3) as response:
                      data = json.load(response)
                  assert [course["id"] for course in data["courses"]] == ["opensource-sw-2026-2"]
                  assert len(data["cards"]) == 8
                  assert data["status"]["transport"] == "offline"
                  print("Container check passed: course, 8 cards, offline demo.")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY

      - name: Check Docker Hub configuration
        id: hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image built and tested. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable publishing."
          fi

      - name: Sign in to Docker Hub
        if: steps.hub.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image to Docker Hub
        if: steps.hub.outputs.configured == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="${DOCKERHUB_USERNAME}/opensource-study-room-hw3"
          docker tag study-room:ci "${image}:latest"
          docker tag study-room:ci "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

      - name: Write run summary
        env:
          PUBLISHED: ${{ steps.hub.outputs.configured }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          {
            echo '## Study room Docker image'
            echo '- Unit tests: passed (4 tests).'
            echo '- Docker build: passed.'
            echo '- Container HTTP check: passed (course, 8 cards, offline demo).'
            if [[ "$PUBLISHED" == 'true' ]]; then
              echo "- Docker Hub: published to ${DOCKERHUB_USERNAME}/opensource-study-room-hw3."
              echo "- Tags: latest and ${GITHUB_SHA}."
            else
              echo '- Docker Hub: NOT published; account settings are missing.'
              echo '- Add DOCKERHUB_USERNAME (variable or secret) and DOCKERHUB_TOKEN (secret), then run this workflow again.'
            fi
            echo '- Service deployment: see the Deploy to Windows PC job.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up test container
        if: always()
        run: |
          docker logs study-room-ci || true
          docker rm -f study-room-ci || true

  deploy:
    name: Deploy to Windows PC
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && needs.build-and-publish.outputs.published == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Deploy exact image and verify the service
        shell: powershell
        env:
          IMAGE: jsm0308/opensource-study-room-hw3:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $containerName = 'study-room-hw3'
          $volumeName = 'study-room-hw3-data'
          $backupName = 'study-room-hw3-previous-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT

          function Invoke-Docker {
            & docker @args
            if ($LASTEXITCODE -ne 0) { throw "Docker command failed: $($args[0])" }
          }

          Invoke-Docker info --format '{{.OSType}}'
          # Finish the download before interrupting the existing service.
          Invoke-Docker pull $env:IMAGE
          $expectedImage = Invoke-Docker image inspect $env:IMAGE --format '{{.Id}}'
          $names = @(Invoke-Docker ps -a --format '{{.Names}}')
          $hadPrevious = $names -contains $containerName
          $previousRunning = $false
          if ($hadPrevious) {
            $previous = (Invoke-Docker inspect $containerName | ConvertFrom-Json)[0]
            $dataMount = @($previous.Mounts | Where-Object { $_.Destination -eq '/app/data' })
            if ($dataMount.Count -ne 1 -or $dataMount[0].Type -ne 'volume' -or $dataMount[0].Name -ne $volumeName) {
              throw 'Existing data mount differs from the expected named volume. Stopping to preserve data.'
            }
            $previousRunning = $previous.State.Running
            Invoke-Docker stop $containerName
            Invoke-Docker rename $containerName $backupName
          }

          try {
            Invoke-Docker run -d --name $containerName `
              --label "org.opencontainers.image.revision=$env:REVISION" `
              -p 127.0.0.1:10000:10000 `
              --mount "source=$volumeName,target=/app/data" `
              $env:IMAGE

            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $data = Invoke-RestMethod -Uri 'http://127.0.0.1:10000/api/bootstrap' -TimeoutSec 3
                if ($data.courses.id -notcontains 'opensource-sw-2026-2') { throw 'Course missing.' }
                if ($data.status.transport -ne 'offline') { throw 'Demo mode missing.' }
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) { throw 'The new service did not become ready.' }
            $runningImage = Invoke-Docker inspect $containerName --format '{{.Image}}'
            if ($runningImage -ne $expectedImage) { throw 'Running image differs from the published revision.' }
          } catch {
            $failure = $_
            docker logs $containerName
            docker rm -f $containerName
            if ($hadPrevious) {
              Invoke-Docker rename $backupName $containerName
              if ($previousRunning) { Invoke-Docker start $containerName }
            }
            throw $failure
          }

          if ($hadPrevious) { Invoke-Docker rm $backupName }
          @(
            '## Local deployment verified',
            "- Image: $env:IMAGE",
            "- Image ID: $runningImage",
            '- URL: http://127.0.0.1:10000/',
            '- HTTP check: passed; expected course and offline demo confirmed.',
            "- Data volume: $volumeName (preserved)."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
